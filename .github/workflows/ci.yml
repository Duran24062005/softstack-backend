name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check Python compilation
        run: uv run python -m compileall -q app tests

      - name: Run tests
        run: uv run pytest -q

      - name: Check assessment and trainer coverage
        run: uv run pytest -q --cov=app.services.assessment_service --cov=app.services.question_provider --cov=app.routes.assessment_routes --cov=app.repositories.assessment_repository --cov=app.schemas.assessment --cov=app.models.auth --cov=app.middlewares.role_middleware --cov-branch --cov-report=term-missing --cov-fail-under=95 tests/test_assessment_service.py tests/test_assessment_schemas.py tests/test_assessment_repository.py tests/test_assessment_routes.py tests/test_question_provider.py tests/test_progress_repository.py tests/test_auth_service.py

      - name: Check assessment OpenAPI contract
        run: uv run python -c "from app.main import app; paths = app.openapi()['paths']; assert '/assessments/{assessment_id}/attempts' in paths"
